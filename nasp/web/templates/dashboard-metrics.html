{% extends "base.html" %}
{% set active = "Dashboard" %}
{% block page_title %}Network Dashboard - Metrics{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}

{% block content %}
<body class="dashboard-page">
<div class="body">
    <div class="body-title">
        <div class="body-title-opt1" data-navigate="/dashboard-topology?role={{ role }}">
            <i class="bi bi-diagram-3 me-2"></i>TOPOLOGY
        </div>
        <div class="body-title-opt1 active" data-navigate="/dashboard-metrics?role={{ role }}">
            <i class="bi bi-graph-up me-2"></i>METRICS
        </div>
        <div class="body-title-opt2" data-navigate="/dashboard-tracing?role={{ role }}">
            <i class="bi bi-share me-2"></i>TRACING
        </div>
        <div class="body-title-opt2" data-navigate="/dashboard-logs?role={{ role }}">
            <i class="bi bi-file-text me-2"></i>LOGS
        </div>
    </div>
    <div class="body-main">
        <div class="metrics-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="bi bi-graph-up me-2"></i>Network Metrics Dashboard</h3>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary btn-sm" onclick="refreshMetrics()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="exportMetrics()">
                        <i class="bi bi-download me-1"></i>Export
                    </button>
                </div>
            </div>
            <embed type="text/html"
                src="http://10.21.0.6:30444/d/8b7a8b326d7a6f1f04244066368c67af/kubernetes-networking-namespace-pods?orgId=1&refresh=10s&theme=light&var-datasource=default&var-cluster=&var-namespace=ns-{{ request.args.get('s_nssai') }}&var-resolution=30s&var-interval=4h&kiosk"
                width=100% height=600>
        </div>
    </div>
</div>
</body>
{% endblock %}
